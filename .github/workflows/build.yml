name: Build DoubleDoorSync

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager --install "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build packages
        shell: pwsh
        run: ./scripts/package.ps1 -Abi all

      - name: Upload DoubleDoorSync artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoubleDoorSync
          path: build-*/*.levipack
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-*/*.levipack
          
